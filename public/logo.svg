<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the banknote/coin shape -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- Inner glow gradient -->
    <linearGradient id="inner-grad" x1="80" y1="80" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Accent purple -->
    <linearGradient id="accent-grad" x1="100" y1="60" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer ring / coin shape -->
  <circle cx="128" cy="128" r="118" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Inner circle cutout -->
  <circle cx="128" cy="128" r="100" fill="#0f172a" />
  
  <!-- Decorative inner ring -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="url(#bg-grad)" stroke-width="1.5" opacity="0.4" />
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#bg-grad)" stroke-width="0.5" opacity="0.2" />
  
  <!-- Upward trending arrow (income / gelir) -->
  <path d="M60 170 L100 120 L130 145 L196 70" stroke="url(#bg-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#inner-glow)" />
  
  <!-- Arrow head -->
  <path d="M182 68 L200 64 L196 82" stroke="url(#bg-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Dollar / TL sign stylized, center -->
  <text x="128" y="155" text-anchor="middle" font-family="serif" font-size="56" font-weight="bold" fill="url(#inner-grad)" opacity="0.15">₺</text>
  
  <!-- Small decorative dots -->
  <circle cx="60" cy="170" r="4" fill="#10b981" opacity="0.8" />
  <circle cx="100" cy="120" r="3" fill="#34d399" opacity="0.7" />
  <circle cx="130" cy="145" r="3" fill="#6ee7b7" opacity="0.6" />
  <circle cx="196" cy="70" r="5" fill="#a78bfa" opacity="0.9" />
  
  <!-- Sparkle accent -->
  <g transform="translate(196, 60)" opacity="0.7">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
